name: Android

# Gera o APK do app Android (apps/mobile) e anexa à GitHub Release da versão.
# Chamado pelo workflow Release logo depois de publicar a tag; também pode ser disparado à mão
# para (re)gerar o APK de uma release existente.
#
# Assinatura: com os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e
# ANDROID_KEY_PASSWORD, sai o APK de release assinado (atualiza por cima da versão instalada).
# Sem eles, sai um APK de debug, que instala mas não atualiza versões assinadas.
# URL aberta pelo app: variável do repositório ASCEND_APP_URL (padrão: o serviço do render.yaml).
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.3.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.3.0)'
        required: true
        type: string

concurrency:
  group: android-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      ASCEND_APP_URL: ${{ vars.ASCEND_APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Preparar assinatura
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: será publicado um APK de debug."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/ascend-release.jks"
          # Espaços e quebras de linha coladas junto com o segredo não fazem parte do base64.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"

          # Confere os segredos antes do build para apontar qual deles está errado (nenhum valor é exibido).
          # Mesmo corte de espaços nas pontas que o build.gradle aplica.
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
          export STORE_PASSWORD="$(trim "$STORE_PASSWORD")" KEY_PASSWORD="$(trim "$KEY_PASSWORD")"
          KEY_ALIAS="$(trim "$KEY_ALIAS")"
          if ! keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD não abre o keystore de ANDROID_KEYSTORE_BASE64. Os dois precisam vir do mesmo arquivo de chave."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::O keystore não tem a chave indicada em ANDROID_KEY_ALIAS."
            exit 1
          fi
          if [[ "$KEY_PASSWORD" != "$STORE_PASSWORD" ]] && keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD | grep -qi 'PKCS12'; then
            echo "::error::Em keystore PKCS12 a senha da chave é a mesma do keystore: ANDROID_KEY_PASSWORD deve ser igual a ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "Keystore, alias e senhas conferem."
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "variant=release" >> "$GITHUB_OUTPUT"
      - name: Gerar APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: npm run "apk:$VARIANT"
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          src="apps/mobile/android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          name="Ascend-$TAG.apk"
          [[ "$VARIANT" == "debug" ]] && name="Ascend-$TAG-debug.apk"
          cp "$src" "$RUNNER_TEMP/$name"
          gh release upload "$TAG" "$RUNNER_TEMP/$name" --clobber
      - name: Remover keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ascend-release.jks"
