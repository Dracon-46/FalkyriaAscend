name: Bug
description: Algo não funciona como deveria.
title: "fix: "
labels: [bug, triagem]
body:
  - type: textarea
    id: atual
    attributes:
      label: O que aconteceu
      description: Descreva o comportamento atual. Inclua mensagens de erro.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir Missões
        2. Concluir a missão "…"
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Painel, Missões, Hábitos, Metas, Estudos, Treinos, Loja e inventário, Conquistas e temporadas, Estatísticas, Admin, Integrações, Outra]
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: "ex.: v0.1.0, Chrome 140, Android"
  - type: checkboxes
    id: dados
    attributes:
      label: Privacidade
      options:
        - label: Removi tokens, senhas e dados pessoais de prints e logs.
          required: true
